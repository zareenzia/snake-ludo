<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Hub — Snake-Ludo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="css/hub.css" />
  <link rel="prefetch" href="/games/ludo/ludo.html" />
  <link rel="prefetch" href="/games/snakes-ladders/sl.html" />
  <link rel="prefetch" href="/socket.io/socket.io.js" />
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }

    /* ── Animated background ── */
    .bg-particles {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .bg-particle {
      position: absolute; font-size: 1.6rem; opacity: 0.12;
      animation: floatUp linear infinite;
      will-change: transform, opacity;
      contain: strict;
    }
    @keyframes floatUp {
      0% { transform: translateY(110vh) rotate(0deg) scale(0.8); opacity: 0; }
      10% { opacity: 0.15; }
      90% { opacity: 0.12; }
      100% { transform: translateY(-10vh) rotate(360deg) scale(1.2); opacity: 0; }
    }

    /* ── Split layout ── */
    .split-container {
      display: flex; width: 100%; height: 100vh; position: relative; z-index: 1;
    }

    /* Left: Hub panel */
    .hub-panel {
      width: 100%; min-width: 0; height: 100%;
      display: flex; justify-content: center; align-items: center;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                  min-width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto; overflow-x: hidden;
      position: relative;
    }
    .split-container.split .hub-panel {
      width: 38%; min-width: 320px;
    }

    /* Right: Game panel */
    .game-panel {
      width: 0; height: 100%; overflow: hidden; position: relative;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      border-left: 2px solid transparent;
    }
    .split-container.split .game-panel {
      width: 62%;
      border-left-color: rgba(255,255,255,0.06);
    }

    .game-frame {
      width: 100%; height: 100%; border: none;
      background: linear-gradient(135deg, #0f0c29, #1a1a2e);
      opacity: 0; transition: opacity 0.4s 0.3s;
    }
    .split-container.split .game-frame { opacity: 1; }

    /* Back button */
    .game-back-btn {
      position: absolute; top: 12px; left: 12px; z-index: 50;
      background: rgba(20,20,40,0.9); color: #ccd;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 7px 16px; border-radius: 10px; font-family: 'Nunito', sans-serif;
      font-weight: 700; font-size: 0.82rem; cursor: pointer;
      transition: all 0.2s; backdrop-filter: blur(10px);
      opacity: 0; pointer-events: none;
      transform: translateX(-20px);
      transition: all 0.3s 0.4s;
    }
    .split-container.split .game-back-btn {
      opacity: 1; pointer-events: all; transform: translateX(0);
    }
    .game-back-btn:hover { background: rgba(50,50,80,0.95); color: #fff; }

    /* Loading spinner */
    .game-loading {
      position: absolute; inset: 0; z-index: 40;
      display: flex; justify-content: center; align-items: center;
      background: linear-gradient(135deg, #0f0c29ee, #1a1a2eee);
      transition: opacity 0.3s;
    }
    .game-loading.hidden { opacity: 0; pointer-events: none; }
    .game-spinner {
      width: 44px; height: 44px;
      border: 4px solid rgba(255,255,255,0.08);
      border-top-color: #0ead69; border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Divider glow line */
    .split-container.split .game-panel::before {
      content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 2px;
      background: linear-gradient(180deg, transparent, #0ead6944, #e9456044, transparent);
      z-index: 5;
    }

    /* Active card highlight */
    .game-card.active {
      border-color: var(--card-color) !important;
      box-shadow: 0 0 20px var(--card-color, #0ead69)33 !important;
      transform: scale(0.97) !important;
    }

    /* Hub shrink adjustments */
    .split-container.split .hub-container { padding: 16px 12px; }
    .split-container.split .hub-logo { font-size: 2.5rem; }
    .split-container.split .hub-title { font-size: 1.6rem; }
    .split-container.split .hub-subtitle { font-size: 0.8rem; }
    .split-container.split .game-cards { gap: 12px; }
    .split-container.split .game-card { padding: 20px 16px 16px; }
    .split-container.split .card-icon { font-size: 2rem; }
    .split-container.split .card-title { font-size: 1rem; }
    .split-container.split .card-desc { font-size: 0.72rem; }

    /* Mobile: stack vertically */
    @media (max-width: 768px) {
      .split-container { flex-direction: column; }
      .split-container.split .hub-panel { width: 100%; min-width: 0; height: 45%; }
      .split-container.split .game-panel { width: 100%; height: 55%; }
      .game-panel { border-left: none; border-top: 2px solid transparent; }
      .split-container.split .game-panel { border-top-color: rgba(255,255,255,0.06); }
      .split-container.split .game-panel::before { display: none; }
    }
  </style>
</head>
<body>
  <!-- Animated background particles -->
  <div class="bg-particles" id="bg-particles"></div>

  <div class="split-container" id="split-container">
    <!-- ═══ Left: Hub ═══ -->
    <div class="hub-panel">
      <div class="hub-container">
        <div class="hub-header">
          <div class="hub-logo">🎲</div>
          <h1 class="hub-title">Game Hub</h1>
          <p class="hub-subtitle">Choose your game</p>
          <div class="hub-profile-bar" id="hub-profile">
            <span class="hub-level" id="hub-level">Lvl 1</span>
            <span class="hub-coins">🪙 <strong id="hub-coins">0</strong></span>
            <a href="/shop.html" class="hub-shop-btn">🛒 Shop</a>
          </div>
        </div>
        <div class="game-cards" id="game-cards"></div>
      </div>
    </div>

    <!-- ═══ Right: Game ═══ -->
    <div class="game-panel" id="game-panel">
      <button class="game-back-btn" id="btn-back">← Close</button>
      <div class="game-loading" id="game-loading">
        <div class="game-spinner"></div>
      </div>
      <!-- Iframes are pre-created per game for instant switching -->
    </div>
  </div>

  <script src="js/profile.js"></script>
  <script>
    /* ── Background particles ── */
    (function () {
      var emojis = ['🎲','🐍','🪜','⭐','🎯','👑','💎','🔥','🚀','🎮','🏆','🪙'];
      var container = document.getElementById('bg-particles');
      for (var i = 0; i < 8; i++) {
        var p = document.createElement('div');
        p.className = 'bg-particle';
        p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        p.style.left = Math.random() * 100 + '%';
        p.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
        p.style.animationDuration = (12 + Math.random() * 18) + 's';
        p.style.animationDelay = -(Math.random() * 20) + 's';
        container.appendChild(p);
      }
    })();

    /* ── Game registry ── */
    var GAMES = [
      { id: 'ludo', title: 'Ludo', desc: 'Classic Ludo + Snakes & Ladders hybrid. Local play, 2–4 players.', icon: '🎯', color: '#e94560', url: '/games/ludo/ludo.html', badge: 'Local' },
      { id: 'snakes-ladders', title: 'Snakes & Ladders', desc: 'Real-time online multiplayer. Create or join a room with friends!', icon: '🐍', color: '#0ead69', url: '/games/snakes-ladders/sl.html', badge: 'Online' },
    ];

    var splitEl = document.getElementById('split-container');
    var loadingEl = document.getElementById('game-loading');
    var gamePanelEl = document.getElementById('game-panel');
    var cardsEl = document.getElementById('game-cards');
    var activeCard = null;
    var activeFrameId = null;

    /* ── Pre-warm: create hidden iframes for each game ── */
    var gameFrames = {};
    var gameLoaded = {};
    GAMES.forEach(function (g) {
      var iframe = document.createElement('iframe');
      iframe.id = 'game-frame-' + g.id;
      iframe.className = 'game-frame';
      iframe.style.display = 'none';
      iframe.src = g.url;
      iframe.onload = function () {
        gameLoaded[g.id] = true;
        try {
          var doc = iframe.contentDocument || iframe.contentWindow.document;
          var bl = doc.getElementById('back-link');
          if (bl) bl.style.display = 'none';
        } catch (e) {}
        // If this game is currently active, hide the spinner
        if (activeFrameId === g.id) loadingEl.classList.add('hidden');
      };
      gamePanelEl.appendChild(iframe);
      gameFrames[g.id] = iframe;
    });

    GAMES.forEach(function (g) {
      var card = document.createElement('div');
      card.className = 'game-card';
      card.setAttribute('data-game', g.id);
      card.style.setProperty('--card-color', g.color);
      card.innerHTML =
        '<div class="card-badge" style="background:' + g.color + '">' + g.badge + '</div>' +
        '<div class="card-icon">' + g.icon + '</div>' +
        '<h2 class="card-title">' + g.title + '</h2>' +
        '<p class="card-desc">' + g.desc + '</p>' +
        '<div class="card-play">Play →</div>';
      card.addEventListener('click', function () { openGame(g, card); });
      cardsEl.appendChild(card);
    });

    function openGame(game, card) {
      if (activeCard) activeCard.classList.remove('active');
      activeCard = card;
      card.classList.add('active');
      activeFrameId = game.id;

      // Hide all frames, show the selected one
      GAMES.forEach(function (g) { gameFrames[g.id].style.display = 'none'; });
      gameFrames[game.id].style.display = 'block';

      // Show spinner only if not yet loaded
      if (gameLoaded[game.id]) {
        loadingEl.classList.add('hidden');
      } else {
        loadingEl.classList.remove('hidden');
      }

      splitEl.classList.add('split');
    }

    function closeGame() {
      splitEl.classList.remove('split');
      if (activeCard) { activeCard.classList.remove('active'); activeCard = null; }
      activeFrameId = null;
      setTimeout(function () {
        // Just hide, don't destroy — keeps iframe warm for instant re-open
        GAMES.forEach(function (g) { gameFrames[g.id].style.display = 'none'; });
        loadingEl.classList.remove('hidden');
        refreshProfile();
      }, 650);
    }

    document.getElementById('btn-back').addEventListener('click', closeGame);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && splitEl.classList.contains('split')) closeGame();
    });

    function refreshProfile() {
      var prof = GameProfile.get();
      document.getElementById('hub-coins').textContent = prof.coins;
      document.getElementById('hub-level').textContent = 'Lvl ' + prof.level;
    }
    refreshProfile();
  </script>
</body>
</html>
