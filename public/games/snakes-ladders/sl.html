<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snakes & Ladders — Game Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/sl.css" />
</head>
<body>
  <a href="/" class="back-link" id="back-link">← Menu</a>

  <!-- ══════ JOIN / CREATE SCREEN ══════ -->
  <div id="screen-join" class="screen">
    <div class="logo-area">
      <div class="logo-icon">🐍</div>
      <h1>Snakes & Ladders</h1>
      <p class="subtitle">Real-time online multiplayer</p>
    </div>
    <div class="join-form glass-card">
      <input type="text" id="input-name" class="input" placeholder="Your name" maxlength="16" />
      <div class="color-picker-section">
        <label class="color-label">Your color:</label>
        <div class="color-swatches" id="join-color-picker"></div>
      </div>
      <button id="btn-create" class="btn btn-primary">Create Room</button>
      <div class="divider"><span>or</span></div>
      <input type="text" id="input-code" class="input" placeholder="Room code" maxlength="6" style="text-transform:uppercase" />
      <button id="btn-join" class="btn btn-secondary">Join Room</button>
      <div class="divider"><span>or</span></div>
      <div class="color-picker-section">
        <label class="color-label">AI color:</label>
        <div class="color-swatches" id="join-ai-color-picker"></div>
      </div>
      <button id="btn-quick-ai" class="btn btn-ai">⚡ Quick Play vs AI</button>
    </div>
  </div>

  <!-- ══════ LOBBY SCREEN ══════ -->
  <div id="screen-lobby" class="screen hidden">
    <div class="glass-card lobby-card">
      <h2>Room: <span id="lobby-code" class="room-code"></span></h2>
      <div id="lobby-players" class="lobby-players"></div>
      <div id="lobby-settings" class="lobby-settings"></div>
      <div id="lobby-actions" class="lobby-actions"></div>
      <div id="lobby-msg" class="lobby-msg"></div>
    </div>
  </div>

  <!-- ══════ GAME SCREEN (restructured layout) ══════ -->
  <div id="screen-game" class="screen hidden">
    <div class="game-layout">

      <!-- Left: Move log -->
      <div class="move-log-panel">
        <div class="log-header">📜 Move Log</div>
        <div class="log-entries" id="move-log"></div>
      </div>

      <!-- Center: Board + controls -->
      <div class="game-center">
        <!-- Player emoji faces -->
        <div class="player-faces" id="player-faces"></div>
        <div class="game-top-bar">
          <div id="sl-turn-indicator" class="turn-indicator"></div>
          <div class="game-actions">
            <button id="btn-restart-game" class="btn btn-sm btn-secondary" title="Restart">↻ Restart</button>
            <button id="btn-exit-game" class="btn btn-sm btn-danger" title="Exit">✕ Exit</button>
          </div>
        </div>

        <div id="sl-board-wrap" class="board-wrap">
          <canvas id="sl-canvas"></canvas>
        </div>

        <!-- Per-player dice row -->
        <div id="player-dice-row" class="player-dice-row"></div>

        <div id="sl-message" class="message-area"></div>
      </div>

    </div>
  </div>

  <!-- ══════ GAME OVER SCREEN ══════ -->
  <div id="screen-gameover" class="screen hidden">
    <div class="glass-card gameover-card">
      <div class="trophy">🏆</div>
      <h1 id="go-title"></h1>
      <div id="go-rankings" class="rankings"></div>
      <div class="go-actions">
        <button id="btn-play-again" class="btn btn-primary">Play Again</button>
        <a href="/" class="btn btn-secondary">Exit to Menu</a>
      </div>
    </div>
  </div>

  <!-- ══════ TOASTS ══════ -->
  <div id="toast-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/sl-board.js"></script>
  <script src="js/sl-client.js"></script>
</body>
</html>
